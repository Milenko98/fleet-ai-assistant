services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: docker/php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy

  # Testovi: docker compose run --rm phpunit  (argumenti se dodaju, npr. --filter=FleetToolsTest)
  phpunit:
    build: docker/php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_DATABASE: fleet_test
    entrypoint: ["php", "artisan", "test"]
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:26-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5174:5174"

volumes:
  pgdata:
